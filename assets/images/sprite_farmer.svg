<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="160" height="220">
  <defs>
    <radialGradient id="skinGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff1ee"/>
      <stop offset="70%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </radialGradient>
    <linearGradient id="hatGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="tunicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="80" cy="208" rx="42" ry="10" fill="#000000" opacity="0.3"/>

  <!-- Character Group -->
  <g filter="url(#dropShadow)">
    <!-- Wooden Hoe Handle resting on shoulder -->
    <line x1="40" y1="180" x2="140" y2="45" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
    <!-- Golden Hoe Blade -->
    <path d="M 130 35 L 155 30 L 145 60 L 122 55 Z" fill="#eab308" stroke="#78350f" stroke-width="2.5"/>

    <!-- Left Leg -->
    <rect x="60" y="152" width="16" height="38" rx="6" fill="#475569"/>
    <!-- Left Sandal / Foot -->
    <ellipse cx="68" cy="192" rx="12" ry="7" fill="#854d0e"/>

    <!-- Right Leg -->
    <rect x="84" y="152" width="16" height="38" rx="6" fill="#475569"/>
    <!-- Right Sandal / Foot -->
    <ellipse cx="92" cy="192" rx="12" ry="7" fill="#854d0e"/>

    <!-- Peasant Tunic Body -->
    <path d="M 52 108 L 108 108 L 115 158 L 45 158 Z" fill="url(#tunicGrad)" stroke="#64748b" stroke-width="2"/>
    <!-- Brown Sash Belt -->
    <rect x="48" y="138" width="64" height="12" rx="2" fill="#854d0e"/>
    <rect x="74" y="136" width="12" height="16" rx="2" fill="#ca8a04"/>

    <!-- Arms -->
    <!-- Left Arm -->
    <path d="M 52 112 Q 36 130 54 142" fill="none" stroke="#fed7aa" stroke-width="12" stroke-linecap="round"/>
    <!-- Right Arm holding hoe -->
    <path d="M 108 112 Q 120 125 106 136" fill="none" stroke="#fed7aa" stroke-width="12" stroke-linecap="round"/>

    <!-- Chibi Head -->
    <circle cx="80" cy="74" r="34" fill="url(#skinGrad)" stroke="#ca8a04" stroke-width="2"/>
    <!-- Cute Ears -->
    <ellipse cx="46" cy="75" rx="6" ry="8" fill="#fed7aa"/>
    <ellipse cx="114" cy="75" rx="6" ry="8" fill="#fed7aa"/>

    <!-- Spiky Anime Fringe Hair -->
    <path d="M 46 62 Q 60 76 70 66 Q 80 80 92 64 Q 102 78 114 62" fill="#451a03"/>

    <!-- Big Expressive Chibi Eyes -->
    <ellipse cx="65" cy="74" rx="7" ry="9" fill="#1c1917"/>
    <circle cx="63" cy="71" r="3.5" fill="#ffffff"/>
    <circle cx="67" cy="77" r="1.5" fill="#ffffff"/>

    <ellipse cx="95" cy="74" rx="7" ry="9" fill="#1c1917"/>
    <circle cx="93" cy="71" r="3.5" fill="#ffffff"/>
    <circle cx="97" cy="77" r="1.5" fill="#ffffff"/>

    <!-- Pink Blushing Cheeks -->
    <ellipse cx="58" cy="84" rx="6" ry="3.5" fill="#fb7185" opacity="0.7"/>
    <ellipse cx="102" cy="84" rx="6" ry="3.5" fill="#fb7185" opacity="0.7"/>

    <!-- Cheerful Smile -->
    <path d="M 74 84 Q 80 92 86 84" fill="none" stroke="#991b1b" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Conical Straw Hat (Nón Lá) -->
    <polygon points="80,10 148,60 12,60" fill="url(#hatGrad)" stroke="#854d0e" stroke-width="3"/>
    <path d="M 12 60 Q 80 72 148 60" fill="#ca8a04" stroke="#854d0e" stroke-width="2"/>
    <path d="M 32 46 Q 80 54 128 46" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 50 32 Q 80 38 110 32" fill="none" stroke="#a16207" stroke-width="2"/>
  </g>
</svg>
