<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" width="160" height="220">
  <defs>
    <radialGradient id="girlSkin" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="70%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </radialGradient>
    <linearGradient id="dressRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="60%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="80" cy="208" rx="38" ry="9" fill="#000000" opacity="0.3"/>

  <g filter="url(#shadowGlow)">
    <!-- Red Flowing Hair Ribbons in Back -->
    <path d="M 40 40 Q 20 80 28 130" fill="none" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
    <path d="M 120 40 Q 140 80 132 130" fill="none" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>

    <!-- Martial Hanfu Robe -->
    <!-- Red Skirt -->
    <path d="M 54 125 L 106 125 L 120 185 L 40 185 Z" fill="url(#dressRed)" stroke="#9f1239" stroke-width="2"/>
    <!-- White Inner Undergarment -->
    <path d="M 66 95 L 94 95 L 100 130 L 60 130 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Red Cross Collar Vest -->
    <path d="M 52 95 L 76 130 L 84 130 L 108 95" fill="none" stroke="#e11d48" stroke-width="10" stroke-linecap="round"/>
    <!-- Gold Embroidered Sash -->
    <rect x="52" y="122" width="56" height="10" rx="3" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>

    <!-- White Boots -->
    <ellipse cx="68" cy="192" rx="10" ry="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="92" cy="192" rx="10" ry="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

    <!-- Arms in Martial Greeting Stance -->
    <path d="M 52 105 Q 65 125 74 116" fill="none" stroke="#ffe4e6" stroke-width="10" stroke-linecap="round"/>
    <path d="M 108 105 Q 95 125 86 116" fill="none" stroke="#ffe4e6" stroke-width="10" stroke-linecap="round"/>

    <!-- Head -->
    <circle cx="80" cy="65" r="32" fill="url(#girlSkin)" stroke="#fb7185" stroke-width="1.5"/>

    <!-- Twin Floral Hair Buns (Odango) -->
    <circle cx="42" cy="36" r="16" fill="#1c1917"/>
    <circle cx="118" cy="36" r="16" fill="#1c1917"/>
    <!-- Red Ribbon Bows on Buns -->
    <ellipse cx="42" cy="46" rx="8" ry="4" fill="#e11d48"/>
    <ellipse cx="118" cy="46" rx="8" ry="4" fill="#e11d48"/>
    <!-- Gold Hairpins -->
    <circle cx="42" cy="32" r="4" fill="#fde047"/>
    <circle cx="118" cy="32" r="4" fill="#fde047"/>

    <!-- Cute Bangs & Hairline -->
    <path d="M 48 55 C 55 45, 68 45, 80 50 C 92 45, 105 45, 112 55" fill="#1c1917"/>

    <!-- Big Sparkling Anime Eyes -->
    <ellipse cx="65" cy="66" rx="6.5" ry="9" fill="#1c1917"/>
    <circle cx="63" cy="63" r="3" fill="#ffffff"/>
    <circle cx="67" cy="69" r="1.5" fill="#ffffff"/>

    <ellipse cx="95" cy="66" rx="6.5" ry="9" fill="#1c1917"/>
    <circle cx="93" cy="63" r="3" fill="#ffffff"/>
    <circle cx="97" cy="69" r="1.5" fill="#ffffff"/>

    <!-- Blushing Cheeks -->
    <ellipse cx="58" cy="74" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>
    <ellipse cx="102" cy="74" rx="7" ry="4" fill="#f43f5e" opacity="0.6"/>

    <!-- Smile -->
    <path d="M 75 74 Q 80 81 85 74" fill="none" stroke="#be123c" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
