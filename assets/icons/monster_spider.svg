<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="spiderBody" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="70%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>
  </defs>
  <!-- 8 Jointed Legs -->
  <path d="M 38 45 Q 12 25 8 40" fill="none" stroke="#2e1065" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 62 45 Q 88 25 92 40" fill="none" stroke="#2e1065" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 36 50 Q 10 45 6 65" fill="none" stroke="#2e1065" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 64 50 Q 90 45 94 65" fill="none" stroke="#2e1065" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 38 56 Q 14 70 12 90" fill="none" stroke="#2e1065" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 62 56 Q 86 70 88 90" fill="none" stroke="#2e1065" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Abdomen -->
  <ellipse cx="50" cy="62" rx="22" ry="24" fill="url(#spiderBody)" stroke="#1e1b4b" stroke-width="2"/>
  <!-- Skull/Poison Pattern on Back -->
  <circle cx="50" cy="58" r="8" fill="#22c55e"/>
  <circle cx="46" cy="70" r="4" fill="#22c55e"/>
  <circle cx="54" cy="70" r="4" fill="#22c55e"/>
  <!-- Cephalothorax (Head) -->
  <circle cx="50" cy="40" r="14" fill="#1e1b4b" stroke="#0f172a" stroke-width="2"/>
  <!-- Multiple Glowing Red Eyes -->
  <circle cx="45" cy="36" r="2.5" fill="#ef4444"/>
  <circle cx="55" cy="36" r="2.5" fill="#ef4444"/>
  <circle cx="42" cy="41" r="1.8" fill="#ef4444"/>
  <circle cx="58" cy="41" r="1.8" fill="#ef4444"/>
  <!-- Fangs -->
  <polygon points="45,48 42,56 46,51" fill="#cbd5e1"/>
  <polygon points="55,48 58,56 54,51" fill="#cbd5e1"/>
</svg>
