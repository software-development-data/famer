<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="redLiquid" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </radialGradient>
    <linearGradient id="cork" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <!-- Cork Stopper -->
  <rect x="42" y="12" width="16" height="10" rx="2" fill="url(#cork)"/>
  <!-- Bottle Neck -->
  <rect x="44" y="22" width="12" height="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <!-- Spherical Glass Flask -->
  <circle cx="50" cy="62" r="28" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <!-- Red Health Fluid -->
  <path d="M 24 62 Q 50 68 76 62 A 26 26 0 0 1 24 62 Z" fill="url(#redLiquid)"/>
  <!-- Glass Shine -->
  <path d="M 32 46 Q 40 40 54 42" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  <!-- Bubbles -->
  <circle cx="45" cy="72" r="3" fill="#ffffff" opacity="0.6"/>
  <circle cx="56" cy="66" r="2" fill="#ffffff" opacity="0.7"/>
</svg>
