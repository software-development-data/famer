  <ellipse cx="60" cy="45" rx="5" ry="3" fill="#0f172a"/>
  <!-- Diagonal Scar over Eye -->
  <line x1="36" y1="38" x2="44" y2="52" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
</svg>
