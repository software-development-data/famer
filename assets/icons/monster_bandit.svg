<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="faceSkin" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fba86b"/>
    </radialGradient>
  </defs>
  <!-- Red Headband / Bandana -->
  <path d="M 22 28 C 30 18, 70 18, 78 28 L 76 40 L 24 40 Z" fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
