<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#facc15" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Handle -->
  <line x1="25" y1="85" x2="68" y2="28" stroke="url(#woodGrad)" stroke-width="8" stroke-linecap="round"/>
  <!-- Metal Collar -->
  <rect x="62" y="24" width="12" height="8" rx="2" fill="#78716c" transform="rotate(-40 68 28)"/>
  <!-- Hoe Blade -->
  <path d="M 58 20 L 85 24 L 75 52 L 52 46 Z" fill="url(#goldGrad)" stroke="#78350f" stroke-width="2" filter="url(#glow)"/>
  <!-- Blade Edge highlight -->
  <line x1="75" y1="52" x2="52" y2="46" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Sparkles -->
  <polygon points="76,14 78,18 82,20 78,22 76,26 74,22 70,20 74,18" fill="#ffffff"/>
</svg>
